<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengaturan Challenge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>⚙️ Pengaturan Permainan</h2>
    
    <!-- PENGATURAN PAPAN BARU -->
    <div class="form-group" style="background: #e3f2fd; padding: 15px; border-radius: 8px;">
      <h3 style="margin-top: 0; width: 100%;">Tentukan Ukuran Papan</h3>
      <input type="number" id="inputUkuran" placeholder="Misal: 7 (untuk 7x7)" min="4" max="20">
      <button id="btnSimpanPapan" class="btn btn-secondary">Buat Papan & Acak Ular Tangga</button>
      <small style="width: 100%; color: #555;">Mengubah ukuran papan akan mereset permainan dan mengacak ular tangga baru.</small>
    </div>

    <hr style="margin: 30px 0; border: 1px solid #ddd;">

    <!-- PENGATURAN CHALLENGE -->
    <div class="form-group">
      <h3 style="margin-top: 0; width: 100%;">Buat Challenge Baru</h3>
      <input type="number" id="inputKotak" placeholder="Nomor Kotak" min="1">
      <input type="text" id="inputTantangan" placeholder="Isi tantangan (misal: Push up 5x)">
      <button id="btnSimpan" class="btn">Simpan</button>
    </div>

    <h3>Daftar Challenge Aktif:</h3>
    <ul id="listChallenge" class="challenge-list"></ul>
    
    <br>
    <a href="index.html" class="btn btn-secondary" style="width: 100%; text-align: center; box-sizing: border-box;">Kembali ke Menu</a>
  </div>
  <script type="module" src="settings.js"></script>
</body>
</html>
